aid: 6k
name: 6K
description: >-
  6K Inc is a North Andover, Massachusetts advanced-materials company that produces
  engineered powders and battery materials with UniMelt, its patented microwave-based
  production-scale plasma system. Named for the roughly 6,000 K plasma temperature it
  operates at — the temperature of the surface of the sun — UniMelt uses tightly
  controlled thermal plasma beams to melt or vaporize precursor feedstock into particles
  with precise size distribution and crystalline phase, in seconds rather than the days
  conventional processes require, while cutting energy use and eliminating wastewater.
  The company operates through two divisions. 6K Additive, with production in
  Burgettstown, Pennsylvania, makes sustainably sourced metal powders for additive
  manufacturing — titanium Ti-6Al-4V, nickel superalloys Ni625 and Ni718, stainless
  SS316L, refractory tungsten, niobium C103, copper C18150 and the HEA1000 refractory
  alloy — reclaiming CNC scrap and revert metal into premium AM powder. 6K Energy
  produces domestically sourced lithium-ion battery cathode and solid-state materials
  including NMC, LFP, LLZO, LMO, LTO and LNMO. Additional applications span semiconductor
  CMP, specialty ceramics, advanced coatings, lighting and display materials,
  nano-engineered powders, and federal/defense programs; 6K has received US Department of
  Defense and Department of Energy awards for domestic critical-materials capacity. 6K is
  a privately held company whose shares trade on secondary markets. Enrichment probing on
  2026-07-31 found no public developer API, OpenAPI/AsyncAPI/GraphQL contract, developer
  portal, SDK, MCP server, agent card, or event surface — 6K is a materials manufacturer,
  not an API provider.
